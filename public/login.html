<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Grand Horizon Luxury Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos específicos para la pantalla de Login integrados para mantener estética luxury */
    body.login-body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at center, rgba(197, 168, 128, 0.05) 0%, transparent 70%);
    }

    .login-container {
      background: var(--bg-panel);
      border: 1px solid var(--border-gold);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      position: relative;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: -1px; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--text-active), transparent);
    }

    .login-logo {
      font-family: var(--font-serif);
      font-size: 28px;
      color: var(--text-active);
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .login-subtitle {
      font-family: var(--font-sans);
      font-size: 10px;
      color: var(--text-gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .login-form .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .login-form label {
      display: block;
      font-size: 11px;
      color: var(--text-gold);
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .login-form input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid rgba(197, 168, 128, 0.3);
      color: var(--text-active);
      padding: 12px;
      font-size: 14px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.3s;
    }

    .login-form input:focus {
      border-color: var(--text-active);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--border-gold);
      color: var(--text-gold);
      font-family: var(--font-serif);
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }

    .login-btn:hover {
      background: var(--text-active);
      color: var(--bg-dark);
      border-color: var(--text-active);
    }

    #login-error {
      color: #ff4c4c;
      font-size: 12px;
      margin-top: 15px;
      min-height: 15px;
    }
  </style>
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-logo">GRAND HORIZON</div>
    <div class="login-subtitle">Sistema de Gestión Operativa</div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>
      
      <button type="submit" class="login-btn">INGRESAR</button>
      <div id="login-error"></div>
    </form>
  </div>

  <script>
    // Si ya tiene token, redirigir al index
    if (localStorage.getItem('hotel_token')) {
      window.location.href = '/';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const errDiv = document.getElementById('login-error');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: user, password: pass })
        });

        const data = await response.json();

        if (response.ok) {
          // Guardar token y datos de usuario en localStorage
          localStorage.setItem('hotel_token', data.token);
          localStorage.setItem('hotel_user', JSON.stringify(data.usuario));
          window.location.href = '/'; // Redirigir al dashboard
        } else {
          errDiv.textContent = data.error || 'Credenciales inválidas.';
        }
      } catch (err) {
        errDiv.textContent = 'Error de conexión con el servidor.';
      }
    });
  </script>
</body>
</html>
