<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-hotel-titulo-login>Acceso al Sistema - System Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Configuración central del hotel -->
  <script src="js/hotel.config.js"></script>
  <style>
    /* Transiciones de tema en la página de login */
    body.login-body,
    .login-container,
    .login-form input {
      transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }

    body.login-body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at center, rgba(197, 168, 128, 0.05) 0%, transparent 70%);
    }

    /* Botón de tema flotante en esquina superior derecha */
    .login-theme-btn {
      position: fixed;
      top: 18px;
      right: 22px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-panel);
      border: 1px solid var(--border-gold);
      color: var(--text-gold);
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.25s, color 0.25s, transform 0.15s, box-shadow 0.25s;
      position: fixed;
      overflow: hidden;
      user-select: none;
      z-index: 999;
    }
    .login-theme-btn:hover {
      background: var(--border-gold);
      color: var(--bg-dark);
      box-shadow: 0 0 12px var(--gold-glow);
    }
    .login-theme-btn:active {
      transform: scale(0.93);
      box-shadow: none;
    }
    .login-theme-btn .t-icon {
      font-size: 13px;
      transition: transform 0.3s;
    }
    .login-theme-btn:active .t-icon {
      transform: rotate(30deg) scale(1.2);
    }

    .login-container {
      background: var(--bg-panel);
      border: 1px solid var(--border-gold);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
      position: relative;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: -1px; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--text-active), transparent);
    }

    .login-logo {
      font-family: var(--font-serif);
      font-size: 28px;
      color: var(--text-active);
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .login-subtitle {
      font-family: var(--font-sans);
      font-size: 10px;
      color: var(--text-gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .login-form .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .login-form label {
      display: block;
      font-size: 11px;
      color: var(--text-gold);
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .login-form input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid rgba(197, 168, 128, 0.3);
      color: var(--text-active);
      padding: 12px;
      font-size: 14px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.3s, background 0.4s, color 0.4s;
    }

    .login-form input:focus {
      border-color: var(--text-active);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--border-gold);
      color: var(--text-gold);
      font-family: var(--font-serif);
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover {
      background: var(--text-active);
      color: var(--bg-dark);
      border-color: var(--text-active);
    }

    .login-btn:active {
      transform: scale(0.97);
      box-shadow: none;
    }

    #login-error {
      color: #e05555;
      font-size: 12px;
      margin-top: 15px;
      min-height: 15px;
    }

    /* Ripple en el botón de login */
    .ripple-wave {
      position: absolute;
      border-radius: 50%;
      background: rgba(197, 168, 128, 0.35);
      transform: scale(0);
      animation: ripple-expand 0.55s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
      pointer-events: none;
    }
    @keyframes ripple-expand {
      0%   { transform: scale(0); opacity: 0.7; }
      80%  { transform: scale(3.5); opacity: 0.15; }
      100% { transform: scale(4); opacity: 0; }
    }

    /* ── Fondo con imagen (opción 2) ── */
    body.login-body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('media/img/login-bg.jpg') center/cover no-repeat;
      filter: blur(4px);
      transform: scale(1.05);
      z-index: -2;
    }
    body.login-body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(8, 8, 12, 0.72);
      z-index: -1;
      transition: background 0.4s;
    }
    body.login-body[data-theme="light"]::after {
      background: rgba(245, 240, 230, 0.78);
    }
    .login-container {
      background: rgba(15, 15, 22, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 0 60px rgba(197, 168, 128, 0.18), 0 10px 30px rgba(0,0,0,0.4);
      animation: login-fade 0.8s ease both;
    }
    body.login-body[data-theme="light"] .login-container {
      background: rgba(255, 255, 255, 0.6);
    }
    @keyframes login-fade {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Información en espacios vacíos (opción 4) ── */
    .login-clock {
      position: fixed;
      top: 18px; left: 22px;
      font-family: var(--font-sans);
      color: var(--text-gold);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.6;
    }
    .login-clock #clock-time {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--text-active);
      letter-spacing: 2px;
    }
    .login-footer {
      position: fixed;
      bottom: 16px; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--text-gold);
      text-transform: uppercase;
    }
    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4caf7a;
      margin-right: 7px;
      box-shadow: 0 0 8px #4caf7a;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot { 50% { opacity: 0.35; } }

    /* ── Layout dividido (side by side) ── */
    body.login-body::before,
    body.login-body::after { display: none; }
    body.login-body {
      justify-content: center;
      padding-left: 58%;
      box-sizing: border-box;
    }
    .login-visual {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 58%;
      background:
        linear-gradient(90deg, rgba(8,8,12,0.25) 0%, rgba(8,8,12,0.55) 70%, var(--bg-dark) 100%),
        linear-gradient(0deg, rgba(8,8,12,0.85) 0%, transparent 45%),
        url('media/img/login-bg.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 60px 90px;
      animation: login-fade 1s ease both;
    }
    .login-visual .tagline {
      font-family: var(--font-serif);
      font-size: 38px;
      line-height: 1.2;
      color: #f3e7d0;
      letter-spacing: 2px;
      max-width: 460px;
    }
    .login-visual .tagline-sub {
      margin-top: 14px;
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e2c89a;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }
    .login-visual .tagline-line {
      width: 60px; height: 1px;
      background: var(--text-active);
      margin-bottom: 22px;
    }
    .login-container {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      box-shadow: none;
    }
    .login-container::before { display: none; }
    /* Groupbox */
    .login-container {
      border: 1px solid var(--border-gold);
      padding: 48px 40px 36px;
      margin: 0 24px;
    }
    .groupbox-title {
      position: absolute;
      top: -8px; left: 24px;
      padding: 0 12px;
      background: var(--bg-dark);
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-gold);
      line-height: 16px;
    }
    .login-footer {
      left: 58%;
      justify-content: center;
      padding: 0;
      color: var(--text-gold);
    }
    body.login-body[data-theme="light"] .login-footer,
    body.login-body[data-theme="light"] .login-clock { color: #6b5a3e; }
    body.login-body[data-theme="light"] .groupbox-title { color: #6b5a3e; }
    body.login-body[data-theme="light"] .login-container { background: transparent; }
    .login-clock { z-index: 2; left: calc(58% + 24px); }
    /* Modo claro: sin difuminado, corte limpio con línea dorada */
    body.login-body[data-theme="light"] .login-visual {
      background:
        linear-gradient(0deg, rgba(8,8,12,0.8) 0%, transparent 45%),
        url('media/img/login-bg.jpg') center/cover no-repeat;
      border-right: 1px solid var(--border-gold);
    }
    @media (max-width: 900px) {
      body.login-body { padding-left: 0; }
      .login-clock { left: 22px; }
      .login-visual { width: 100%; opacity: 0.25; z-index: -1; }
    }
  </style>
</head>
<body class="login-body">

  <!-- Panel visual izquierdo -->
  <div class="login-visual" aria-hidden="true">
    <div class="tagline-line"></div>
    <div class="tagline">Gestión con elegancia</div>
    <div class="tagline-sub">Control total de su hotel</div>
  </div>

  <!-- Botón de tema flotante -->
  <button class="login-theme-btn" id="login-theme-btn" title="Cambiar tema">
    <span class="t-icon" id="login-theme-icon">☽</span>
    <span id="login-theme-label">MODO OSCURO</span>
  </button>

  <div class="login-container">
    <span class="groupbox-title">Acceso al sistema</span>
    <div class="login-logo" data-hotel-nombre>SYSTEM HOTEL</div>
    <div class="login-subtitle" data-hotel-subtitulo>Sistema de Gestión Operativa</div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>
      
      <button type="submit" class="login-btn" id="login-submit-btn">INGRESAR</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div class="login-clock">
    <div id="clock-time">--:--</div>
    <div id="clock-date"></div>
  </div>

  <footer class="login-footer">
    <span>© <span id="footer-year"></span> System Hotel</span>
  </footer>

  <script>
    // ── Reloj y año ───────────────────────────────────────
    function tickClock() {
      const n = new Date();
      document.getElementById('clock-time').textContent =
        n.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('clock-date').textContent =
        n.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    tickClock(); setInterval(tickClock, 1000);
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    // ── Redirigir si ya tiene sesión ──────────────────────
    if (localStorage.getItem('hotel_token')) {
      window.location.replace('/');
      throw new Error('Ya autenticado, redirigiendo.');
    }

    // ── Tema claro/oscuro en login ────────────────────────
    const temaGuardado = localStorage.getItem('hotelTheme') || 'light'; // DEFAULT: CLARO
    let temaActual = temaGuardado;

    function aplicarTema(tema) {
      document.body.setAttribute('data-theme', tema);
      const icon  = document.getElementById('login-theme-icon');
      const label = document.getElementById('login-theme-label');
      if (tema === 'dark') {
        icon.textContent  = '☀';
        label.textContent = 'MODO CLARO';
      } else {
        icon.textContent  = '☽';
        label.textContent = 'MODO OSCURO';
      }
    }

    aplicarTema(temaActual);

    document.getElementById('login-theme-btn').addEventListener('click', () => {
      temaActual = temaActual === 'dark' ? 'light' : 'dark';
      aplicarTema(temaActual);
      localStorage.setItem('hotelTheme', temaActual);
    });

    // ── Ripple en el botón de ingresar ────────────────────
    document.addEventListener('click', function(e) {
      const btn = e.target.closest('.login-btn, .login-theme-btn');
      if (!btn) return;
      const old = btn.querySelector('.ripple-wave');
      if (old) old.remove();
      const rect = btn.getBoundingClientRect();
      const size = Math.max(btn.offsetWidth, btn.offsetHeight);
      const wave = document.createElement('span');
      wave.classList.add('ripple-wave');
      wave.style.width  = wave.style.height = `${size}px`;
      wave.style.left   = `${e.clientX - rect.left - size / 2}px`;
      wave.style.top    = `${e.clientY - rect.top  - size / 2}px`;
      btn.appendChild(wave);
      wave.addEventListener('animationend', () => wave.remove(), { once: true });
    });

    // ── Formulario de login ───────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user    = document.getElementById('username').value;
      const pass    = document.getElementById('password').value;
      const errDiv  = document.getElementById('login-error');
      const btn     = document.getElementById('login-submit-btn');

      btn.disabled = true;
      btn.textContent = 'VERIFICANDO...';
      errDiv.textContent = '';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: user, password: pass })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('hotel_token', data.token);
          localStorage.setItem('hotel_user', JSON.stringify(data.usuario));
          btn.textContent = '✓ ACCESO CONCEDIDO';
          setTimeout(() => { window.location.replace('/'); }, 400);
        } else {
          errDiv.textContent = data.error || 'Credenciales inválidas.';
          btn.disabled = false;
          btn.textContent = 'INGRESAR';
        }
      } catch (err) {
        errDiv.textContent = 'Error de conexión con el servidor.';
        btn.disabled = false;
        btn.textContent = 'INGRESAR';
      }
    });
  </script>
</body>
</html>
